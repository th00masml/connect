[project]
name = "artifact-signals"
version = "0.2.0"
description = "Pre-registered diagnostic signals for benchmark artifacts in LLM reasoning evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
fast = ["rapidfuzz>=3"]
hf = ["torch", "transformers>=4.40"]
api = ["openai>=1"]
data = ["datasets"]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
artifact-signals = "artifact_signals.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B006", "B008"]
ignore = ["E741"]  # `l` for a line is the house idiom
